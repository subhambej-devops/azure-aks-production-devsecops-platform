apiVersion: v1
kind: Service
metadata:
  name: {{ include "ratings-api.fullname" . }}
  namespace: ratings
  labels:
    {{- include "ratings-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "ratings-api.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

