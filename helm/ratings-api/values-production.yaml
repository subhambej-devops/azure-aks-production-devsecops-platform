replicaCount: 3
environment: production
image:
  repository: replace.azurecr.io/ratings-api
  tag: "production"
ingress:
  host: ratings.example.com
autoscaling:
  minReplicas: 3
  maxReplicas: 10
podDisruptionBudget:
  minAvailable: 2
rollout:
  enabled: true
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 180s
      - setWeight: 50
      - pause:
          duration: 300s
      - setWeight: 100
